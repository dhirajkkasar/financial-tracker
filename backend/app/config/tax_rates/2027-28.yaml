# FY 2027-28 (provisional — rates carried from 2026-27; update after Budget 2027) tax rules: Finance Act 2024 rates continued (Budget 2026 made no
# rate changes; Income-tax Act, 2025 in force from 01-Apr-2026, same rates).
# Holding periods: listed equity 12 months; nearly all other assets 24 months.
# Rates: equity STCG 20% / LTCG 12.5% above Rs 1.25L; others LTCG 12.5%
# without indexation; STCG at slab. Specified MF units (<=35% equity) bought
# on/after 01-Apr-2023 are deemed short-term (slab) irrespective of holding.
# SGB RBI-redemption exemption (Budget 2026 amendment w.e.f. 01-Apr-2026):
# exempt ONLY for bonds subscribed at primary issuance AND held continuously
# to 8-year maturity. Secondary-market purchases redeemed with RBI are taxable
# (12.5% LTCG if held >12m, slab if <=12m) even on RBI redemption.
#
# stcg_rate_pct / ltcg_rate_pct: null = slab rate
# overrides: ordered list — all matching overrides merge top-to-bottom

STOCK_IN:
  stcg_rate_pct: 20.0
  ltcg_rate_pct: 12.5
  stcg_days: 365
  ltcg_exemption_inr: 125000
  ltcg_exempt_eligible: true

